<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тинькофф 8PRO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #111;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 50px 20px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: #ffdd2d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .version {
            margin-top: 8px;
            color: #777;
            font-size: 16px;
        }

        .card {
            margin-top: 35px;
            padding: 25px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .install {
            display: block;
            margin-top: 20px;
            padding: 16px;
            border-radius: 14px;
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .info {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Т</div>

    <h1>Тинькофф 8PRO</h1>

    <div class="version">
        Версия 3.1.1
    </div>

    <div class="card">

        <div>
            Установка приложения на iPhone
        </div>

        <a class="install"
           href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/bosskin-pro/tinkoff-ipa/main/manifest.plist">
            Установить
        </a>

        <div class="info">
            Нажмите «Установить» и дождитесь окончания установки.
        </div>

    </div>

</div>

</body>
</html>
